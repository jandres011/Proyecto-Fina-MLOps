services:
  # Servicio MLflow para registro de métricas
  mlflow:
    build: ../mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./mlflow_data:/mlflow/data
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    networks:
      - mlops_network


  # Servicio LLM Connector
  llm_connector:
    build: ../llm-connector
    ports:
      - "8001:8001"
    enviroment:
      - GEMINI_API_KEY=$(GEMINI_API_KEY)
      - GEMINI_MODEL=%(GEMINI_MODEL)
    networks:
      - mlops_network

  # Servicio ML Clásico
  sklearn_model:
    build:
      context: ../sklearn_model
    container_name: sklearn_model
    ports:
      - "8002:8002"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_URI=models:/ml-classic-wine-classification/latest
    depends_on:
      - mlflow
    networks:
      - mlops_network
    command: bash -c "python train.py && uvicorn predict:app --host 0.0.0.0 --port 8002"

  # Servicio CNN
  cnn:
    build: ../cnn-image
    ports:
      - "8003:8003"
    depends_on:
      - mlflow
    volumes:
      - ../cnn-image/models:/app/models  # Para montar modelo entrenado
    networks:
      - mlops_network
    command: bash -c "python train.py && uvicorn predict:app --host 0.0.0.0 --port 8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Servicio Frontend Gradio
  frontend_gradio:
    build: ../gradio_frontend
    ports:
      - "7860:7860"
    environment:
    - LLM_SERVICE_URL=http://llm_connector:8001
    - ML_SERVICE_URL=http://sklearn_model:8002
    - CNN_SERVICE_URL=http://cnn:8003
    depends_on:
      - llm_connector
      - sklearn_model
      - cnn
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge

volumes:
  ollama_models:
  mlflow_artifacts:
