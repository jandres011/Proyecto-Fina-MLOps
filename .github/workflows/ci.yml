name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OTHER_ENV_VAR: ${{ secrets.OTHER_ENV_VAR }} # si tienes más

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest black mypy

      - name: Validate structure
        run: |
          ls -la
          test -d llm-connector
          test -d sklearn_model
          test -d cnn-image
          test -d gradio_frontend
          test -d infra
          test -d mlflow
          echo "Estructura OK"

      - name: Check code style (Black)
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | xargs black --check

      - name: Install service dependencies and run tests
        run: |
          for svc in llm-connector sklearn_model cnn-image gradio_frontend; do
            echo "Testing $svc"
            cd $svc
            pip install -r requirements.txt || true
            cd ..
          done

      - name: Build Docker images
        run: |
          docker build -t llm_connector llm-connector/
          docker build -t ml_model sklearn_model/
          docker build -t cnn cnn-image/
          docker build -t frontend_gradio gradio_frontend/
          docker build -t mlflow mlflow/

      - name: Test docker-compose up
        run: |
          cd infra
          docker compose up -d --build
          sleep 12
          docker compose ps
          docker compose logs --tail 50
          docker compose down
