name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest black mypy

      - name: Validate structure
        run: |
          echo "Verificando estructura de carpetas..."
          ls -la
          test -d llm-connector
          test -d sklearn_model
          test -d cnn-image
          test -d gradio_frontend
          test -d infra
          test -d mlflow
          echo "Estructura válida"

      - name: Check code style (Black)
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | xargs black --check

      - name: Run tests for each service
        run: |
          cd ./sklearn_model && python -m pytest tests/ -v

      - name: Build Docker images
        run: |
          docker build -t llm_connector llm-connector/
          docker build -t ml_model sklearn_model/
          docker build -t cnn cnn-image/
          docker build -t frontend_gradio gradio_frontend/
          docker build -t mlflow mlflow/

      - name: Test docker-compose up
        run: |
          cd infra
          docker-compose up -d --build
          sleep 10
          docker-compose ps
          docker-compose logs
          docker-compose down
